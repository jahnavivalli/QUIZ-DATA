<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>How Much of an Average MU Student Are You?</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main>

        <!-- INTRO SCREEN -->

        <div id="intro-screen">

            <h1>HOW MUCH OF AN<br>AVERAGE MU STUDENT ARE YOU?</h1>

            <h2>A student spending habits quiz</h2>

            <p>
                We asked <strong>17 MU students</strong> about their spending habits.
            </p>

            <p>
                Now let's see how closely <strong>you</strong> match them.
            </p>

            <button onclick="startQuiz()">TAKE THE QUIZ →</button>

        </div>


        <!-- QUIZ SCREEN -->

        <div id="quiz-screen" style="display: none;">

            <p id="progress"></p>

            <h2 id="question"></h2>

            <div id="answers"></div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
